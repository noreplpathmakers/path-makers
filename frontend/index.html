<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta Tags -->
  <!-- Primary Meta Tags -->
  <title>PathMakers - Premier Freelance Marketplace for Digital Services</title>
  <meta name="title" content="PathMakers - Premier Freelance Marketplace for Digital Services" />
  <meta name="description"
    content="Hire top-tier freelancers on PathMakers. The ultimate digital ecosystem for web development, graphic design, content writing, SEO, and more. Bring your vision to life today." />
  <meta name="keywords"
    content="PathMakers, Freelancing, Freelance Marketplace, Hire Freelancers, Digital Services, Remote Work, Web Development, Graphic Design, Content Writing, Digital Marketing, SEO Services, Online Jobs, Freelance Platform, Gig Economy, Professional Services" />
  <link rel="canonical" href="https://path-makers.vercel.app/" />

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "PathMakers",
          "url": "https://path-makers.vercel.app",
          "logo": "https://path-makers.vercel.app/logo.png",
          "sameAs": [
            "https://twitter.com/pathmakers",
            "https://facebook.com/pathmakers",
            "https://instagram.com/pathmakers"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+1-555-123-4567",
            "contactType": "Customer Support"
          }
        },
        {
          "@type": "WebSite",
          "name": "PathMakers",
          "url": "https://path-makers.vercel.app",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://path-makers.vercel.app/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
  </script>

  <!-- Open Graph / Facebook -->
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://path-makers.vercel.app/" />
  <meta property="og:title" content="PathMakers - Freelancers" />

    content="Redefine your digital experience with PathMakers. We provide next-gen digital ecosystems and top-tier freelance services to bring your vision to life." />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />

  <meta property="twitter:description"
    content="Redefine your digital experience with PathMakers. We provide next-gen digital ecosystems and top-tier freelance services to bring your vision to life." />
  <meta property="twitter:image" content="/logo.png" />
</head>
